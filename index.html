<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Formulario de registro</h2>

        <p class="Descripción">
            Complete los siguientes campos donde debe anexar sus datos para realizar su registro.
        </p>
    </header>

    <div class="contenedor">
        <form action="#" method="post">

            <div class="campo">
                <label for="nombre">Nombre:</label>
                <input 
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre" required>
            </div>

            <div class="campo">
                <label for="apellido">Apellido:</label>
                <input 
                    type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingrese su apellido" required>
            </div>

            <div class="campo">
                <label for="tipo_documento">Tipo de documento:</label>
                <select name="tipo_documento" id="tipo_documento" required>

                    <option value="cc" selected>
                        Cédula de ciudadanía
                    </option>

                    <option value="ti">
                        Tarjeta de identidad
                    </option>

                    <option value="ce">
                        Cédula de extranjería
                    </option>

                    <option value="pasaporte">
                        Pasaporte
                    </option>
                </select>
            </div>

            <div class="campo">
                <label for="dni">DNI:</label>
                <input 
                    type="text"
                    id="dni"
                    name="dni"
                    placeholder="Ingrese su número de DNI" required>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de nacimiento:</label>
                <input 
                    type="date"
                    id="fecha"
                    name="fecha" required>
            </div>

            <div class="campo">
                <label for="telefono">Número de teléfono:</label>
                <input 
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ingrese su número de teléfono" required>
            </div>

            <div class="campo">
                <label for="email">Email:</label>
                <input 
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="pais">País de domicilio:</label>

                <select name="pais" id="pais" required>
                <option value="colombia" selected>Colombia</option>
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="mexico">México</option>
                <option value="españa">España</option>
                </select>
            </div> 

            <div class="campo"> 
                <label for="ciudad">Ciudad de domicilio:</label> 
 
                <select name="ciudad" id="ciudad" required>

                <option value="" selected disabled>
                    Seleccione la ciudad de domicilio
                </option>
 
                <optgroup label="Colombia"> 
                    <option value="bogota">Bogotá</option> 
                    <option value="medellin">Medellín</option> 
                    <option value="cali">Cali</option> 
                </optgroup> 
 
                <optgroup label="Argentina"> 
                    <option value="buenos_aires">Buenos Aires</option> 
                    <option value="cordoba">Córdoba</option> 
                    <option value="rosario">Rosario</option> 
                </optgroup> 
 
                <optgroup label="Brasil"> 
                    <option value="brasilia">Brasilia</option> 
                    <option value="sao_paulo">São Paulo</option> 
                    <option value="rio_janeiro">Río de Janeiro</option> 
                </optgroup> 
 
                <optgroup label="México"> 
                    <option value="ciudad_mexico">Ciudad de México</option> 
                    <option value="guadalajara">Guadalajara</option> 
                    <option value="monterrey">Monterrey</option> 
                </optgroup> 
 
                <optgroup label="España"> 
                    <option value="madrid">Madrid</option> 
                    <option value="barcelona">Barcelona</option> 
                    <option value="valencia">Valencia</option> 
                </optgroup>  
                </select> 
            </div>

            <div class="terminos">  
                <input 
                    type="checkbox"
                    id="datos"
                    name="datos"
                    required>

                <label for="datos">
                    Acepto el tratamiento de datos personales.
                </label>
            </div>

            <button type="submit">
                Enviar datos
            </button>

        </form>

    </div>

</body>
</html>
